services:
  postgres:
    image: postgres:17-alpine
    container_name: zer0ne-barber-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
      POSTGRES_DB: zer0ne_barber
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barber -d zer0ne_barber']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
